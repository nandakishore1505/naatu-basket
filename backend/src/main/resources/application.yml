spring:
  application:
    name: naatu-basket

  datasource:
    url: jdbc:postgresql://localhost:5432/naatu_basket
    username: naatu_admin
    password: dev_local_pg_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
      password: dev_local_redis_pass

server:
  port: 8080