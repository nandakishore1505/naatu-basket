spring:
  application:
    name: naatu-basket

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/naatu_basket}
    username: ${DB_USERNAME:naatu_admin}
    password: ${DB_PASSWORD:dev_local_pg_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:dev_local_redis_pass}

  mvc:
    problemdetails:
      enabled: false

  web:
    resources:
      add-mappings: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

# ============================================
# Application specific configuration
# ============================================

app:
  cors:
    # Comma separated list of allowed browser origins
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

  jwt:
    # MUST be overridden in production. Minimum 32 bytes for HS256.
    secret: ${JWT_SECRET:dev_local_jwt_secret_change_me_at_least_32_chars_long}
    issuer: naatu-basket
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P30D}

  otp:
    length: 6
    ttl: ${OTP_TTL:PT5M}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    resend-cooldown: ${OTP_RESEND_COOLDOWN:PT1M}
    # When true the OTP is returned in the API response and logged instead of
    # being sent over SMS. Never enable this in production.
    dev-mode: ${OTP_DEV_MODE:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.naatubasket.backend: ${LOG_LEVEL:INFO}
